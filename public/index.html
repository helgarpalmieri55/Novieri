<title>Novieri</title>
<!-- Static language gate: relative URLs so it works at the domain root
     (GoDaddy) and under a project base path (GitHub Pages) alike. -->

  var lang = (navigator.languages && navigator.languages[0]) || navigator.language || "es";
  location.replace(/^en\b/i.test(lang) ? "en/" : "es/");
</script>
<style>
  body{margin:0;display:grid;place-items:center;min-height:100vh;background:#fff;color:#16121d;font:16px/1.5 system-ui,sans-serif}
  main{text-align:center}
  a{color:#4f3461}
</style>
</head>
<body>
<main>
  <p>&middot;&middot; novieri</p>
  <p><a href="es/">Espa&ntilde;ol</a> &nbsp;&middot;&nbsp; <a href="en/">English</a></p>
</main>
</body>
</html>
