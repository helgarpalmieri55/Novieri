<!--
  templateType: base_template
  label: Novieri base
-->
<!doctype html>
<html lang="{{ html_lang }}" {{ html_lang_dir }}>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_meta.html_title }}</title>
    <meta name="description" content="{{ page_meta.meta_description }}" />
    {{ require_css(get_asset_url("../css/theme.css")) }}
    {# Opt into animations before first paint; content stays visible without JS #}
    <script>document.documentElement.classList.add("js");</script>
    {{ standard_header_includes }}
  </head>
  <body class="{{ builtin_body_classes }}">
    <main id="main">{% block body %}{% endblock body %}</main>
    {{ standard_footer_includes }}
  </body>
</html>
