{# Sylvi — the website assistant. Every string is a module field, so the
   copy is editable in the page editor without a deploy. The logic lives in
   module.js and talks to the serverless function in src/app/functions. #}

<div
  class="sylvi"
  data-endpoint="{{ module.endpoint|escape_attr }}"
  data-error="{{ module.error_text|escape_attr }}"
  data-limit="{{ module.limit_text|escape_attr }}"
>
  <button
    type="button"
    class="sylvi-toggle chat-fab fixed bottom-5 right-5 z-40 flex h-14 w-14 items-center justify-center rounded-full text-white transition-transform duration-300 hover:scale-110"
    aria-expanded="false"
    aria-label="{{ module.open_label|escape_attr }}"
    data-open-label="{{ module.open_label|escape_attr }}"
    data-close-label="{{ module.close_label|escape_attr }}"
  >
    {# Two speech bubbles: it has to read as "chat" at a glance. #}
    <svg class="sylvi-icon-open" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 15.5H5.2L2.5 18v-11a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2z" />
      <path d="M8 10.5v-.5a2 2 0 0 1 2-2h9.5a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-.8l-2.2 2.5V18" />
    </svg>
    <svg class="sylvi-icon-close hidden" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 3l12 12M15 3L3 15" />
    </svg>
  </button>

  <div
    class="sylvi-panel hidden fixed bottom-24 right-5 z-40 flex h-[min(70vh,540px)] w-[min(92vw,380px)] flex-col overflow-hidden rounded-2xl border border-line bg-white shadow-[0_8px_40px_rgba(22,18,29,0.18)]"
    role="dialog"
    aria-label="{{ module.title|escape_attr }}"
  >
    <div class="dark-s relative flex items-center gap-3 px-5 py-4">
      <div aria-hidden="true" class="seam absolute inset-x-0 top-0"></div>
      <span aria-hidden="true" class="text-gold-bright">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z" />
        </svg>
      </span>
      <div>
        <p class="text-small font-medium leading-tight">{{ module.title }}</p>
        <p class="idx-mono mt-0.5 lowercase text-on-dark-faint">·· novieri</p>
      </div>
    </div>

    <div class="sylvi-log flex-1 overflow-y-auto px-4 py-4">
      <div class="mb-3 max-w-[85%] rounded-2xl rounded-tl-md bg-plum-wash px-4 py-2.5 text-small text-ink">
        {{ module.greeting }}
      </div>
    </div>

    <form class="sylvi-form flex items-center gap-2 border-t border-line p-3">
      <input
        type="text"
        class="sylvi-input min-w-0 flex-1 rounded-lg border border-line px-3.5 py-2.5 text-small placeholder:text-ink-faint focus:border-plum focus:outline-none"
        placeholder="{{ module.placeholder|escape_attr }}"
        maxlength="1000"
        autocomplete="off"
      />
      <button
        type="submit"
        class="sylvi-send flex h-10 w-10 flex-none items-center justify-center rounded-lg bg-plum text-white transition-colors hover:bg-plum-deep disabled:opacity-40"
        aria-label="{{ module.send_label|escape_attr }}"
        disabled
      >
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2 7 9M14 2l-4.5 12.5L7 9 1.5 6.5 14 2z" />
        </svg>
      </button>
    </form>
  </div>
</div>
