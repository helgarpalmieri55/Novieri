{# Closing band: dark, one statement, one action. #}
<section class="dark-s relative overflow-hidden">
  <div aria-hidden="true" class="seam absolute inset-x-0 top-0"></div>
  <div class="container-site section-pad">
    <p class="reveal eyebrow eyebrow-on-dark">{{ module.eyebrow }}</p>
    <h2 class="reveal mt-4 max-w-[18ch] text-[clamp(2.125rem,4.8vw,3.625rem)]">{{ module.title }}</h2>
    <p class="reveal mt-4 max-w-[52ch] text-lead text-on-dark-muted" style="--rd: 80ms">{{ module.subtitle }}</p>
    {% if module.button.label %}
      <a href="{{ module.button.link.url.href }}" class="btn btn-white reveal mt-9" style="--rd: 160ms">{{ module.button.label }}</a>
    {% endif %}
  </div>
</section>
