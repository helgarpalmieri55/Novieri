{# The low-commitment entry point: ten questions, an AI report, gated on
   contact details. Sits between the services and the proof of them. #}
<section class="border-y border-line bg-plum-wash">
  <div class="container-site section-pad-tight grid items-center gap-[clamp(2rem,5vw,4rem)] lg:grid-cols-[7fr_5fr]">
    <div class="reveal">
      <span class="eyebrow">{{ module.eyebrow }}</span>
      <h2 class="mt-4 max-w-[18ch]">{{ module.title }}</h2>
      <p class="mt-5 max-w-[56ch] text-ink-muted">{{ module.intro }}</p>
    </div>
    <div class="reveal lg:justify-self-end" style="--rd: 120ms">
      {% if module.button_text %}
        <a href="{{ module.button_link.url.href }}" class="btn btn-primary text-body !px-8 !py-4">
          {{ module.button_text }} <span aria-hidden="true">→</span>
        </a>
      {% endif %}
      <p class="idx-mono mt-4 text-ink-faint">{{ module.note }}</p>
    </div>
  </div>
</section>
