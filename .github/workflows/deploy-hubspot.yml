name: Deploy to HubSpot

# Uploads the HubSpot project (theme + serverless functions) on every push to
# main. The two secrets come from `hs init` — the personal access key is the
# only credential involved; nothing here can read it back out.
#
# The build step regenerates two files that must never be edited by hand:
# Sylvi's company profile (from the site's own copy) and the theme stylesheet
# (Tailwind, scanning the HubL templates).

on:
  push:
    branches: [main]
    paths:
      - "hubspot/**"
      - "messages/**"
      - "src/app/globals.css"
      - "scripts/build-company-profile.mjs"
      - ".github/workflows/deploy-hubspot.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: "deploy"
        options:
          - deploy
          - list-secrets

env:
  DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
  DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
  # 2026.03 serverless functions need 8.4.0+; the pin was 8.0.0, which
  # uploaded them without registering their public endpoints.
  DEFAULT_CLI_VERSION: "8.10.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # platformVersion 2026.03 requires Node 22
          cache: npm
      - run: npm ci
      - name: Build the profile and the theme stylesheet
        run: npm run build:hubspot
      - name: Fail if the build left anything uncommitted
        # Both generated files are committed so the repo always shows what is
        # deployed. A diff here means someone edited copy without rebuilding.
        run: git diff --exit-code hubspot/src/theme/novieri/css/theme.css hubspot/src/app/functions/lib/company-profile.json
      # The official action is not used for the upload. It builds a shell
      # command containing the commit subject and eval()s it, so any commit
      # message with an apostrophe or parenthesis kills the run:
      #   action-utils.sh: eval: line 69: syntax error near unexpected token `('
      # The CLI it wraps takes --use-env and the same two variables, and here
      # the deploy message is ours to quote safely.
      - name: Install the HubSpot CLI
        run: npm install -g "@hubspot/cli@${DEFAULT_CLI_VERSION}"
      # Names only — the CLI never prints a secret's value, so this is a safe
      # way to answer "is the key actually set?" without touching it.
      - name: List the project's secrets
        if: inputs.mode == 'list-secrets'
        working-directory: hubspot
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
        run: hs secrets list --use-env
      - name: Validate and upload the project
        if: inputs.mode != 'list-secrets'
        working-directory: hubspot
        env:
          # --use-env reads these two names, not the DEFAULT_* ones. Without
          # them the CLI looks for a config file that does not exist on a
          # runner: "An error occurred while reading your HubSpot config file:
          # No config file found." The action set exactly these before calling
          # the same commands.
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          hs project validate --use-env
          # --forceCreate answers the "project does not exist, create it?"
          # prompt. Without it the CLI waits on stdin, gets nothing on a
          # runner, and exits 0 having uploaded nothing.
          hs project upload --use-env --forceCreate \
            --message "GitHub Actions ${GITHUB_SHA:0:7}" 2>&1 | tee upload.log
          # A green run that uploaded nothing is worse than a red one.
          grep -Eqi "build|deploy" upload.log || {
            echo "::error::Upload finished without producing a build — see the log above"
            exit 1
          }
