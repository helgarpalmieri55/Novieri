name: Deploy to HubSpot

# Uploads the HubSpot project (theme + serverless functions) on every push to
# main. The two secrets come from `hs init` — the personal access key is the
# only credential involved; nothing here can read it back out.
#
# The build step regenerates two files that must never be edited by hand:
# Atena's company profile (from the site's own copy) and the theme stylesheet
# (Tailwind, scanning the HubL templates).

on:
  push:
    branches: [main]
    paths:
      - "hubspot/**"
      - "messages/**"
      - "src/app/globals.css"
      - "scripts/build-company-profile.mjs"
      - ".github/workflows/deploy-hubspot.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: "deploy"
        options:
          - deploy
          - list-secrets
          - set-diagnostic-form

env:
  DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
  DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
  # 2026.03 serverless functions need 8.4.0+; the pin was 8.0.0, which
  # uploaded them without registering their public endpoints.
  DEFAULT_CLI_VERSION: "8.10.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # platformVersion 2026.03 requires Node 22
          cache: npm
      - run: npm ci
      - name: Build the profile and the theme stylesheet
        run: npm run build:hubspot
      - name: Fail if the build left anything uncommitted
        # Every generated file is committed so the repo always shows what is
        # deployed: the stylesheet, Atena's profile, and the two bundled
        # serverless entrypoints. A diff here means someone edited a source
        # without rebuilding.
        run: git diff --exit-code hubspot/src/theme/novieri/css/theme.css hubspot/functions-src/lib/company-profile.json hubspot/src/app/functions/chat.js hubspot/src/app/functions/diagnose.js
      # The official action is not used for the upload. It builds a shell
      # command containing the commit subject and eval()s it, so any commit
      # message with an apostrophe or parenthesis kills the run:
      #   action-utils.sh: eval: line 69: syntax error near unexpected token `('
      # The CLI it wraps takes --use-env and the same two variables, and here
      # the deploy message is ours to quote safely.
      - name: Install the HubSpot CLI
        run: npm install -g "@hubspot/cli@${DEFAULT_CLI_VERSION}"
      # Names only — the CLI never prints a secret's value, so this is a safe
      # way to answer "is the key actually set?" without touching it.
      # The diagnostic's form GUID. It is a public value — it appears in any
      # embed code — but a function only sees an environment variable if it is
      # a project secret named in that function's secretKeys, so a secret is
      # what it has to be. `hs secrets add` takes the value on stdin.
      - name: Set the diagnostic form secret
        if: inputs.mode == 'set-diagnostic-form'
        working-directory: hubspot
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          FORM_GUID: 42957848-6780-467b-8f8b-4e5944e2ebe0
          # The private app token, which the repo already holds for the CMS
          # API. The functions need it under a name of their own: HubDB rate
          # limiting and the chat handoff both authenticate with it, and both
          # fail open, so neither has ever run and neither said so.
          #
          # HUBSPOT_APP_TOKEN, not PRIVATE_APP_ACCESS_TOKEN. That name is a
          # reserved keyword in an app function's config — `hs project upload`
          # rejects the component outright — so the variable the code used to
          # read could never have held anything.
          HUBSPOT_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: |
          echo "$FORM_GUID" | hs secrets add HUBSPOT_FORM_DIAGNOSTIC --use-env \
            || echo "$FORM_GUID" | hs secrets update HUBSPOT_FORM_DIAGNOSTIC --use-env
          if [ -n "${HUBSPOT_APP_TOKEN:-}" ]; then
            echo "$HUBSPOT_APP_TOKEN" | hs secrets add HUBSPOT_APP_TOKEN --use-env \
              || echo "$HUBSPOT_APP_TOKEN" | hs secrets update HUBSPOT_APP_TOKEN --use-env
          else
            echo "::warning::No HUBSPOT_PRIVATE_APP_TOKEN repo secret — skipping."
          fi
          hs secrets list --use-env
      - name: List the project's secrets
        if: inputs.mode == 'list-secrets'
        working-directory: hubspot
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
        run: hs secrets list --use-env
      # Names are only half the answer: a secret that exists still buys
      # nothing if the token in it lacks the scope. This says which.
      - name: Check what the private app token can do
        if: inputs.mode == 'list-secrets'
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: node scripts/check-hubspot-scopes.mjs
      - name: Validate and upload the project
        if: inputs.mode == 'deploy'
        working-directory: hubspot
        env:
          # --use-env reads these two names, not the DEFAULT_* ones. Without
          # them the CLI looks for a config file that does not exist on a
          # runner: "An error occurred while reading your HubSpot config file:
          # No config file found." The action set exactly these before calling
          # the same commands.
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
          HUBSPOT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          hs project validate --use-env
          # The demo recordings go to the File Manager, not the theme: the
          # theme file system accepts only web assets and silently drops
          # .mp3, which left the audio-demo module rendering src="". The
          # File Manager serves them at /hubfs/audio/<name>.mp3, which is
          # what the module hardcodes.
          hs filemanager upload files/audio audio --use-env
          # The site screenshots, when the capture workflow has produced any.
          if [ -n "$(ls -A hubspot/files/screens 2>/dev/null || ls -A files/screens 2>/dev/null)" ]; then
            hs filemanager upload files/screens screens --use-env
          else
            echo "No screenshots yet — skipping."
          fi
          # --force skips every confirmation prompt. Without it the CLI waits
          # on stdin, gets nothing on a runner, and either uploads nothing or —
          # when a component has been deleted — fails the whole deploy with
          # "You are about to remove a component" against each of the others.
          # (--forceCreate, which this used to pass, is not a flag in v8.)
          hs project upload --use-env --force \
            --message "GitHub Actions ${GITHUB_SHA:0:7}" 2>&1 | tee upload.log
          # A green run that uploaded nothing is worse than a red one.
          grep -Eqi "build|deploy" upload.log || {
            echo "::error::Upload finished without producing a build — see the log above"
            exit 1
          }

      # The one thing neither the build nor the upload can check: that the
      # address in the stylesheet returns a font. All six brand faces 404'd in
      # production and no check caught it, because the CSS was valid and the
      # files were uploaded — only the URL joining them was wrong, and the
      # fallback stack is close enough that no page looked broken. It took a
      # design critique to notice the site had been rendering in system-ui.
      #
      # Runs after the upload so it tests what is now live, and only on a real
      # deploy: the other modes do not touch the theme.
      - name: Verify the brand fonts actually serve
        if: inputs.mode == 'deploy' || github.event_name == 'push'
        run: node scripts/check-font-urls.mjs --domain="${HUBSPOT_SITE_DOMAIN:-www.novieri.com}"
