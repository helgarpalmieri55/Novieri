name: Deploy to GitHub Pages

# Preview deploy: static site only (no PHP backend on Pages, so the chat
# widget is hidden and the contact form falls back to its email message).
#
# The Pages source must be "GitHub Actions", not a branch — the first step
# below sets it. In branch mode GitHub also runs its own Jekyll build, which
# publishes the README as the home page and wins whenever it finishes last.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Pages in "GitHub Actions" mode
        # While the repo is in branch mode, GitHub's built-in Jekyll builder
        # ("pages build and deployment") publishes on every push as well, and
        # whichever of the two deployments finishes last is the one that
        # sticks. Jekyll renders README.md as the home page — which is what
        # the site was serving. configure-pages below does not fix this: it
        # only *creates* a Pages site, it will not move an existing one out of
        # branch mode. This does, and it stops the Jekyll builder for good.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow \
            || echo "::warning::Could not set Pages to Actions mode — set it by hand: Settings > Pages > Source: GitHub Actions"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # Pages serves the site under /<repo-name>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
