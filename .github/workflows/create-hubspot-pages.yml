name: Create HubSpot pages

# Manual only. Creates the site's pages from the deployed theme's templates,
# as DRAFTS, skipping any slug that already exists — so running it twice is
# safe and it will never overwrite something edited in HubSpot.
#
# Needs a repo secret HUBSPOT_PRIVATE_APP_TOKEN: a private app access token
# with the `content` scope. The personal access key the deploy uses is for the
# CLI and will not authenticate the CMS API.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: "dry-run"
        options:
          - dry-run
          - one-page-test
          - verify
          - dump
          - publish
          - fill-content
          - fill-one
          - es-variants
          - es-fill
          - forms-list
          - form-dump
          - form-setup
          - menus
          - menu-dump
          - widgets
          - create-all
          - retemplate
          - rename-products
          - blog-list
          - blog-sync
      slug:
        description: "Slug to verify (verify mode only)"
        default: "about"
      domain:
        description: "Site domain"
        default: "www.novieri.com"

jobs:
  pages:
    runs-on: ubuntu-latest
    # Needed only by the temporary capture steps, which push what they shoot.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TEMPORARY. capture-screens.yml is the real home for this, but GitHub
      # only registers a workflow once it exists on the default branch, so it
      # cannot be dispatched from a feature branch. This rides the free-text
      # slug input — the same trick the blog modes below use, for the same
      # reason — and comes out the moment capture-screens.yml is on main.
      - name: Capture the site screenshots
        if: inputs.slug == 'capture-screens'
        run: |
          set -euo pipefail
          npm ci
          npm i -D playwright --no-save
          npx playwright install --with-deps chromium
          node scripts/capture-screens.mjs
          ls -la hubspot/files/screens
      - name: Commit the captures
        if: inputs.slug == 'capture-screens'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hubspot/files/screens
          if git diff --cached --quiet; then
            echo "No change in the captures."
            exit 0
          fi
          git commit -m "Capture the site screenshots for the AI-powered Websites page"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Create the pages
        if: inputs.slug != 'capture-screens'
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          HUBSPOT_SITE_DOMAIN: ${{ inputs.domain }}
          # The slug as a variable, so the value reaches the shell as data
          # rather than being pasted into the script before it runs.
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            dry-run)       node scripts/create-hubspot-pages.mjs --dry-run ;;
            # Prove one page comes out right before making eleven more.
            one-page-test) node scripts/create-hubspot-pages.mjs --only=about ;;
            # "Created" says nothing about whether the page has any content.
            verify)        node scripts/create-hubspot-pages.mjs --verify='${{ inputs.slug }}' ;;
            # Read the drag-and-drop shape off a page HubSpot itself built.
            dump)          node scripts/create-hubspot-pages.mjs --dump='${{ inputs.slug }}' ;;
            # 'all' publishes every page in the list; a slug publishes one.
            publish)       node scripts/create-hubspot-pages.mjs --publish='${{ inputs.slug }}' ;;
            create-all)    node scripts/create-hubspot-pages.mjs ;;
            # Moves existing pages onto the template the script declares for
            # them. Creation skips a slug that exists, so this is the only way
            # a live page changes template without being deleted and rebuilt.
            retemplate)    node scripts/create-hubspot-pages.mjs --retemplate ;;
            # One-time: /solutions -> /products (and /soluciones -> /productos)
            # with a 301 behind each old path. Safe to re-run.
            #
            # slug=names instead reconciles every page's stored HubSpot name
            # with the name the script declares for it, which is published text
            # — solution.hubl.html puts content.name in the JSON-LD. A page
            # created under an old name keeps it, because creation skips a slug
            # that exists. slug=names-dry-run reports without writing. Riding
            # the free-text slug rather than a new mode value for the reason
            # the blog modes below give: the dispatch API refuses a new mode
            # for a while after the workflow file changes.
            rename-products)
              case "${{ inputs.slug }}" in
                names)         node scripts/create-hubspot-pages.mjs --sync-names ;;
                names-dry-run) node scripts/create-hubspot-pages.mjs --sync-names --dry-run ;;
                *)             node scripts/create-hubspot-pages.mjs --rename-products ;;
              esac ;;
            # The Insights posts. blog-list discovers blogs and their posts;
            # blog-sync upserts content/insights/*.json into the first blog
            # (both languages, paired into language groups) and publishes.
            # slug=create makes blog-list attempt creation instead — the
            # dispatch API refuses new mode values for a while after a push,
            # and the free-text slug input sails past that validation.
            blog-list)
              case "${{ inputs.slug }}" in
                create) node scripts/manage-hubspot-blog.mjs --create ;;
                tidy)   node scripts/manage-hubspot-blog.mjs --tidy ;;
                *)      node scripts/manage-hubspot-blog.mjs --list ;;
              esac ;;
            blog-create)   node scripts/manage-hubspot-blog.mjs --create ;;
            blog-sync)     node scripts/manage-hubspot-blog.mjs --sync ;;
            # Per-page copy from messages/*.json into each page's modules.
            fill-content)  node scripts/fill-hubspot-pages.mjs ;;
            # An "es:" prefix on the slug fills that one page in Spanish —
            # es-fill rewrites every Spanish page from messages/es.json, which
            # is a lot of live copy to move to change one field. The Spanish
            # home is `es:es`: in the Spanish plan the home page's key is its
            # slug, "es", rather than the empty string English holds.
            fill-one)
              case "${{ inputs.slug }}" in
                es:*) node scripts/fill-hubspot-pages.mjs --locale=es --only="${SLUG#es:}" ;;
                *)    node scripts/fill-hubspot-pages.mjs --only="${SLUG}" ;;
              esac ;;
            # Spanish: create the language variants, then fill and publish them.
            es-variants)   node scripts/create-hubspot-pages.mjs --language-variants ;;
            es-fill)       node scripts/fill-hubspot-pages.mjs --locale=es ;;
            # Read-only: what forms exist, and what a page actually stores.
            forms-list)    node scripts/hubspot-forms.mjs ;;
            form-dump)     node scripts/hubspot-forms.mjs --form='${{ inputs.slug }}' ;;
            # Consent copy, the language dropdown, and the Spanish twin.
            # form-setup with slug=handoff-test runs the end-to-end check
            # instead — the same free-text trick the blog modes use, because
            # a new choice option is only dispatchable once it is on main.
            form-setup)
              case "${{ inputs.slug }}" in
                handoff-test) node scripts/check-chat-handoff.mjs ;;
                *)            node scripts/hubspot-form-setup.mjs ;;
              esac ;;
            # Read-only: menu names and ids. Items are added in HubSpot's UI.
            menus)         node scripts/hubspot-menus.mjs ;;
            menu-dump)     node scripts/hubspot-menus.mjs --menu='${{ inputs.slug }}' ;;
            widgets)       node scripts/hubspot-forms.mjs --widgets='${{ inputs.slug }}' ;;
          esac
