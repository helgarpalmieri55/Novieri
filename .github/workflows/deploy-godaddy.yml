name: Deploy to GoDaddy (FTPS)

# Production deploy: static site + PHP backend (server/api -> /api).
# One-time setup:
#   Secrets  (Settings -> Secrets and variables -> Actions -> Secrets):
#     FTP_SERVER    e.g. ftp.novieri.com or the hostname GoDaddy shows
#     FTP_USERNAME  the FTP account user
#     FTP_PASSWORD  the FTP account password
#   Variables (optional):
#     FTP_SERVER_DIR  remote dir ending in "/", e.g. "public_html/" —
#                     omit if the FTP account is already rooted at the web root
#   On the server (once): copy api/config.sample.php to api/config.php and
#   fill in your keys. The deploy never uploads or deletes config.php.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # Same-origin PHP backend -> enables the chat widget + contact form
          NEXT_PUBLIC_API_BASE: /api
          # reCAPTCHA site key. Public by design (it ships in the HTML); the
          # secret half lives only in api/config.php on the server. Repo ->
          # Settings -> Secrets and variables -> Actions -> Variables.
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
      - name: Add PHP backend to the deploy
        run: |
          mkdir -p out/api/data
          cp -r server/api/. out/api/
          cp messages/es.json messages/en.json out/api/data/
      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/config.php
